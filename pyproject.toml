[project]
name = "flexpert-v2"
version = "1.0.0"
description = "Flexpert: per-residue protein flexibility (RMSF) prediction by LoRA fine-tuning protein language models (ProstT5 / SAProt)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "biopython>=1.83",
    "biotite>=1.5.0",
    "datasets>=2.18.0",
    "h5py>=3.15.1",
    "huggingface-hub>=0.34",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "opentsne>=1.0.4",
    "pandas>=2.3.3",
    "peft>=0.17.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "sentencepiece>=0.2.1",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "umap-learn>=0.5.12",
    "wandb>=0.22.3",
]

# Flat script repo (modules live at the top level) — don't try to build it as a package;
# `uv sync` just provisions the dependencies into the virtual environment.
[tool.uv]
package = false
